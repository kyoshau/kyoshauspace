<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Your True Self</title>
    <link href="https://fonts.googleapis.com/css?family=Cinzel:700|Lato:300,400" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="fix.css">
</head>

<body>

    <!-- Initial Screen -->
    <div id="initial-screen" class="screen active">
        <div class="content">
            <h1 class="glitch" data-text="FACE YOUR TRUE SELF">FACE YOUR TRUE SELF</h1>
            <p class="subtitle">The arcana is the means by which all is revealed...</p>
            <button id="ready-btn" class="big-button">I AM READY</button>
        </div>
        <div class="particles"></div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="screen">
        <div class="content">
            <div class="arcana-card">
                <div class="card-number" id="arcana-number"></div>
                <div class="card-name" id="arcana-name"></div>
                <div class="card-symbol" id="arcana-symbol"></div>
            </div>
            <div class="arcana-description">
                <h2 id="arcana-title"></h2>
                <p id="arcana-meaning"></p>
                <div class="traits" id="arcana-traits"></div>
            </div>
            <button id="again-btn" class="small-button">Face Your Shadow Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
